# D38 model registry for the benchmark. The model IN USE is whatever .env SEG_WEIGHTS points to (the benchmark marks
# it). D50 (2026-11-19): only model A is kept (user decision); every other pothole model was deleted permanently
# (D47, D50). Their scores stay in reports/ and docs/DECISIONS.md. The user's original upload stays untouched in
# models/supplied_original/ (not a benchmark entry).
models:
  - id: pothole_seg11n
    path: models/base_model/pothole_seg11n.pt
    role: base
    suggest: true
    label: "model A (in use)"
    note: "D48 YOLO11n-seg from the supplied model's backbone, merged dataset + hard height / lens / night augmentation; in use since D50: mean AP50 0.529 over 17 test sets, eYantra false alarms 0.2 %, phone outlines 0.274"
