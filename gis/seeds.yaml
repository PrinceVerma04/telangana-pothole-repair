# Secunderabad Cantonment Board: the notch of the GHMC polygon that contains this point
# (OSM GHMC excludes the cantonment). Fallback polygon if the notch cannot be derived.
scb:
  agency: SCB
  code: SCB
  circle_code: SCB-C01
  name_en: Secunderabad Cantonment
  name_te: సికింద్రాబాద్ కంటోన్మెంట్
  name_hi: सिकंदराबाद छावनी
  probe: [17.4700, 78.5070]     # Trimulgherry
  expected_km2: [25, 60]        # SCB is ~40 km2
  fallback_polygon:             # [lat, lon] ring, approx.
    - [17.4560, 78.4850]
    - [17.4560, 78.5250]
    - [17.4850, 78.5400]
    - [17.5250, 78.5250]
    - [17.5200, 78.4900]
    - [17.4800, 78.4780]

# Polygon ownership overrides applied after the ref rules (NH/SH/ORR keep their owner) and
# before the default "ULB that contains the segment". name_contains restricts a corridor
# override to the named road (e.g. the flyover, not the road beneath it).
corridor_overrides:
  - owner_agency: HMDA
    reason: "P.V. Narasimha Rao Expressway (elevated, Mehdipatnam-Aramghar) maintained by HMDA (approx.)"
    name_contains: "Narasimha Rao"
    buffer_m: 20

