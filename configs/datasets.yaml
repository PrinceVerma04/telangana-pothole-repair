# D38 dataset registry. One BASE dataset trains the model; every earlier dataset is a TEST set (ml/benchmark.py,
# `make benchmark`). Paths are relative to the repo root. D43 layout: training data in datasets/, every test set in its
# own folder under test_datasets/ (no test image sits inside a training folder). Kinds:
#   yolo        YOLO label files; `pothole_ids` = label ids that are potholes (boxes or polygons, both read as boxes)
#   rdd_locked  the locked RDD-India images; ground truth = the ORIGINAL RDD2022 D40 boxes (as ml.eval did)
#   negatives   images that contain no pothole: scored by the share of images with a false pothole box
#   frames      frame-level labels (labels.json: pothole / clean frame lists): frames found / false alarms
base:
  id: nagar_netra_pothole
  path: datasets/base_nagar_netra_pothole          # make base-dataset (dataset_tools/build_base_dataset.py), leak-free split
  data_yaml: datasets/base_nagar_netra_pothole/data.yaml
  pothole_id: 1                                    # 16 Nagar Netra names, pothole = 1 (head of the base model)
  source: "datasets/supplied_original/pothole_dataset_trained_20260907"
train_sets:                                        # make train DATA=<id> (ml/train_det.py --data <id>)
  base: datasets/base_nagar_netra_pothole/data.yaml                    # base train only (pothole-only, D38)
  combined: datasets/finetune_base_plus_earlier/data.yaml              # D39: base x5 + earlier train/val (make combined-dataset)
  base_neg: datasets/finetune_base_plus_clean_roads/data.yaml          # D42: base x5 + earlier images WITHOUT potholes (make negatives-dataset)
  phone: datasets/finetune_phone_marked/data.yaml                      # D41: phone drive frames you marked (make annotate-export)
tests:
  - id: base_test
    name: Nagar Netra test (leak-free)
    kind: yolo
    images: test_datasets/nagar_netra_test/images
    labels: test_datasets/nagar_netra_test/labels
    pothole_ids: [1]
    primary: true
  - id: rdd_india_locked
    name: RDD-India locked test (514)
    kind: rdd_locked
    images: test_datasets/rdd_india_locked/images
    lock: datasets/splits/rdd_india_test.lock.txt
    note: "public RDD2022 images; tiny distant potholes; models trained on RDD score high here (leakage, D35/D36)"
  - id: bharat_test
    name: BharatPotHole dashcam test
    kind: yolo
    images: test_datasets/bharatpothole_dashcam/images
    labels: test_datasets/bharatpothole_dashcam/labels
    pothole_ids: [0]
  - id: web_test
    name: Web pothole photos (human masks)
    kind: yolo
    images: test_datasets/web_pothole_photos/images
    labels: test_datasets/web_pothole_photos/labels
    pothole_ids: [0]
  - id: eyantra_negatives
    name: eYantra Indian roads without potholes (false alarms)
    kind: negatives
    images: test_datasets/eyantra_clean_roads/images
  - id: phone_street
    name: Phone street walk 2026-11-18 (unseen by every model)
    kind: frames
    images: test_datasets/phone_street_20261118/images
    labels: test_datasets/phone_street_20261118/labels.json
    primary: true
  - id: phone_street_marked
    name: Phone street walk, potholes outlined by hand (D41 annotation dashboard)
    kind: yolo
    images: test_datasets/phone_street_20261118/images
    labels: test_datasets/phone_street_20261118/labels
    pothole_ids: [1]
    require_label: true
    note: "box AP50 against your own outlines; only photos marked 'potholes' or 'no pothole' count (make annotate-export)"
  # --- D48 check sets (generated by dataset_tools/build_check_sets.py; do not edit by hand)
  - {"id": "check_nagar_night", "name": "CHECK night: Nagar Netra test (leak-free)", "kind": "yolo", "images": "test_datasets/check_nagar_night/images", "check": "night", "note": "D48 synthetic night variant of base_test (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_nagar_night/labels", "pothole_ids": [0]}
  - {"id": "check_nagar_zoomout", "name": "CHECK zoomout: Nagar Netra test (leak-free)", "kind": "yolo", "images": "test_datasets/check_nagar_zoomout/images", "check": "zoomout", "note": "D48 synthetic zoomout variant of base_test (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_nagar_zoomout/labels", "pothole_ids": [0]}
  - {"id": "check_nagar_zoomin", "name": "CHECK zoomin: Nagar Netra test (leak-free)", "kind": "yolo", "images": "test_datasets/check_nagar_zoomin/images", "check": "zoomin", "note": "D48 synthetic zoomin variant of base_test (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_nagar_zoomin/labels", "pothole_ids": [0]}
  - {"id": "check_web_night", "name": "CHECK night: Web pothole photos (human masks)", "kind": "yolo", "images": "test_datasets/check_web_night/images", "check": "night", "note": "D48 synthetic night variant of web_test (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_web_night/labels", "pothole_ids": [0]}
  - {"id": "check_web_zoomout", "name": "CHECK zoomout: Web pothole photos (human masks)", "kind": "yolo", "images": "test_datasets/check_web_zoomout/images", "check": "zoomout", "note": "D48 synthetic zoomout variant of web_test (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_web_zoomout/labels", "pothole_ids": [0]}
  - {"id": "check_web_zoomin", "name": "CHECK zoomin: Web pothole photos (human masks)", "kind": "yolo", "images": "test_datasets/check_web_zoomin/images", "check": "zoomin", "note": "D48 synthetic zoomin variant of web_test (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_web_zoomin/labels", "pothole_ids": [0]}
  - {"id": "check_phone_night", "name": "CHECK night: Phone street walk, potholes outlined by hand (D41 annotation dashboard)", "kind": "yolo", "images": "test_datasets/check_phone_night/images", "check": "night", "note": "D48 synthetic night variant of phone_street_marked (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_phone_night/labels", "pothole_ids": [0]}
  - {"id": "check_phone_zoomout", "name": "CHECK zoomout: Phone street walk, potholes outlined by hand (D41 annotation dashboard)", "kind": "yolo", "images": "test_datasets/check_phone_zoomout/images", "check": "zoomout", "note": "D48 synthetic zoomout variant of phone_street_marked (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_phone_zoomout/labels", "pothole_ids": [0]}
  - {"id": "check_phone_zoomin", "name": "CHECK zoomin: Phone street walk, potholes outlined by hand (D41 annotation dashboard)", "kind": "yolo", "images": "test_datasets/check_phone_zoomin/images", "check": "zoomin", "note": "D48 synthetic zoomin variant of phone_street_marked (dataset_tools/build_check_sets.py)", "labels": "test_datasets/check_phone_zoomin/labels", "pothole_ids": [0]}
  - {"id": "check_eyantra_night", "name": "CHECK night: eYantra Indian roads without potholes (false alarms)", "kind": "negatives", "images": "test_datasets/check_eyantra_night/images", "check": "night", "note": "D48 synthetic night variant of eyantra_negatives (dataset_tools/build_check_sets.py)"}
