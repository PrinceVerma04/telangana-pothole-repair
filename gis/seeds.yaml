# Seed data for gis/build_layers.py (WP10). EDITABLE. Everything here is an APPROXIMATION for the demo:
# admin units are written with official: false and must be replaced by GHMC/HMDA-published boundaries
# through POST /v1/admin/admin-units before any operational use.
#
# Coordinates are [lat, lon] WGS84. Where marked "osm", the point is the OSM place node of that name
# (Geofabrik southern-zone extract, 2026-11, ODbL); "approx" points were placed by hand at the
# locality's commonly known centre.
valid_from: "2026-11-01"

# GHMC (2016 limits = OSM relation 7868535 "Hyderabad", admin_level 8): 6 zones, 30 circles.
