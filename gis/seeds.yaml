# CRMP packages (configs/agencies.yaml crmp_packages): corridor polygons = 20 m buffer around the
# GHMC-owned arterial segments (highway classes below) of the hinted zone. "<Zone>-West" takes the
# part of that zone west of the zone's median arterial longitude; the plain zone package the east part.
crmp:
  highways: [trunk, primary, secondary, trunk_link, primary_link, secondary_link]
  buffer_m: 20
